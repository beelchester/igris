[package]
name = "igris"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
datafusion = "55.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
